services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CATALOG_BASE_URL: http://catalog-mock:8080
      WEBHOOK_BASE_URL: http://webhook-mock:8080
    depends_on:
      - redis-master
      - redis-replica
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
      - kafka
      - catalog-mock
      - webhook-mock

  # These two WireMock containers represent dependencies outside the application boundary.
  # They exist only so the golden repository can demonstrate both healthy and failure paths locally.
  catalog-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./infra/wiremock/catalog:/home/wiremock:ro

  webhook-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8082:8080"
    volumes:
      - ./infra/wiremock/webhook:/home/wiremock:ro

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  # REOF DI replication: explicit replica of the controlled Redis master.
  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on:
      - redis-master

  redis-sentinel-1: &sentinel
    image: redis:7.4-alpine
    command: ["sh", "-c", "cp /config/sentinel-template.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel-template.conf:/config/sentinel-template.conf:ro
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    <<: *sentinel

  redis-sentinel-3:
    <<: *sentinel

  kafka:
    image: apache/kafka:4.0.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
