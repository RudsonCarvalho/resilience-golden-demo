apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-golden-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-golden-demo
  template:
    metadata:
      labels:
        app: resilience-golden-demo
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      containers:
        - name: app
          image: ghcr.io/rudsoncarvalho/resilience-golden-demo:latest
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /actuator/health/startup
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: resilience-golden-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: resilience-golden-demo
